<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas Sprite + Scrolling Background</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "https://picsum.photos/800/600?blur";

const sprite = new Image();
sprite.src = "https://opengameart.org/sites/default/files/Green-Cap-Character-Classic-Hero-Edit.png";

let bgX = 0, spriteX = 0, frame = 0, frameCounter = 0;
const frameWidth = 64, frameHeight = 64, totalFrames = 6;

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Scrolling background
  ctx.drawImage(bg, bgX, 0, canvas.width, canvas.height);
  ctx.drawImage(bg, bgX + canvas.width, 0, canvas.width, canvas.height);
  bgX -= 2;
  if (bgX <= -canvas.width) bgX = 0;

  // Animate frames
  frameCounter++;
  if (frameCounter % 6 === 0) {
    frame = (frame + 1) % totalFrames;
  }

  // Draw sprite frame
  ctx.drawImage(sprite,
    frame * frameWidth, 0, frameWidth, frameHeight,
    spriteX, canvas.height - 150, frameWidth, frameHeight
  );

  // Move sprite
  spriteX += 3;
  if (spriteX > canvas.width) spriteX = -frameWidth;

  requestAnimationFrame(loop);
}

Promise.all([
  new Promise(res => bg.onload = res),
  new Promise(res => sprite.onload = res)
]).then(loop);
</script>
</body>
</html>
